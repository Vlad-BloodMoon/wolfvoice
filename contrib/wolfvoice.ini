; wolfvoice — WebRTC voice for an OpenSimulator region.
;
; Install as:  <region>/bin/config/wolfvoice.ini
;
; bin/config/ is deliberate: OpenSim reads every .ini in that directory AFTER
; OpenSim.ini and treats them as overrides (OpenSim/Region/Application/
; ConfigurationLoader.cs, "Override distro settings with contents of inidirectory",
; default inidirectory = "config"). Two useful consequences:
;   * a shared/templated OpenSim.ini can be re-copied without clobbering this, and
;   * with one OpenSim process per region, only that region is affected.
;
; If instead you run many regions in ONE simulator process, this enables WebRTC
; voice for ALL regions in that process — [WebRtcVoice] Enabled is read once per
; process, not per region.
;
; PREREQUISITES — see the README, steps 2-5:
;   1. REQUIRED: the hardened os-webrtc-janus region module BUILT INTO your OpenSim
;      (https://github.com/intelligentwolf/os-webrtc-janus, branch
;      chatsession-p2p-session-id-and-fast-fail). What you do NOT need is a running
;      Janus GATEWAY: the module's WebRtcVoiceServiceConnector posts JSON-RPC to
;      wolfvoice instead.
;   2. The relay key and the credential key copied from the voice server
;      (/etc/wolfvoice/rpc_key and cred_key) to the paths below.
;   3. Voice must be allowed on the ESTATE and on the PARCEL, or the viewer never
;      even asks for voice. This is the single most common reason for "it does
;      nothing": About Land -> Sound -> Allow Voice Chat.

[WebRtcVoice]
    Enabled = true

    ; Send both spatial and non-spatial voice to wolfvoice. This connector is a
    ; plain JSON-RPC 2.0 client and does not care that the far end is Rust rather
    ; than another OpenSim, which is what lets it target wolfvoice instead of a
    ; Janus gateway.
    SpatialVoiceService = WebRtcVoice.dll:WebRtcVoiceServiceConnector
    NonSpatialVoiceService = WebRtcVoice.dll:WebRtcVoiceServiceConnector

    ; Your wolfvoice server: HTTPS, and the HOST NAME on its certificate (not an IP).
    ; The hardened module always verifies the certificate's chain and name, whatever
    ; OpenSim's NoVerifyCertChain says; a normal Let's Encrypt certificate is fine.
    ; The SDP carries the server's DTLS fingerprint, so an attacker who could
    ; rewrite signalling in flight could otherwise become the media endpoint.
    WebRtcVoiceServerURI = https://voice.example.org:9443

    ; Verbose: logs entire SDP bodies. Useful on ONE region while diagnosing,
    ; wasteful across a fleet. (The relay key is never logged.)
    MessageDetails = false

    ; wolfvoice 0.2.0 and the hardened region module - see docs/SECURITY.md.
    ; The relay key (authenticates this region) and the credential key (signs room
    ; tickets). These are the defaults; readable by the OpenSim user; re-read when
    ; they change.
    RpcKeyFile = /etc/opensim/voice_rpc_key
    CredKeyFile = /etc/opensim/voice_cred_key
    ; During the change-over to two keys, also accept call invitations signed with the relay key.
    ; AcceptLegacyCallCredentials = true
    ; Tell wolfvoice where avatars in voice really are, once a second.
    ; PositionFeed = true
    ; STUN servers given to the viewer (Firestorm 7.2.4+ needs at least one).
    ; StunServers = stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
    ; Optional Wolf Territories features, OFF unless set: ad-hoc conferences and
    ; Wolf Chat voice rooms need a conference service of your own here (plus a sim
    ; secret file, [Wolf] SimSecretPath). Leave unset.
    ; ConferenceApiUrl =

[VivoxVoice]
    ; Turn Vivox off wherever WebRTC is on. Both modules register the SAME
    ; capability name and the LAST registration wins, so leaving both enabled is a
    ; race rather than a choice.
    enabled = false
