name: Spatial geometry regression
on:
  push:
    branches: ["fix/spatial-listener-axes"]
  pull_request:
    paths: ["src/mixer.rs", "tests/spatial_geometry.rs"]
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Confirm front-source regression on released mixer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spatial-baseline/src" "$RUNNER_TEMP/spatial-baseline/tests"
          git show 91bcd7c6778222f898dce2919aefe2ac6dd848cc:src/mixer.rs > "$RUNNER_TEMP/spatial-baseline/src/mixer.rs"
          cp tests/spatial_geometry.rs "$RUNNER_TEMP/spatial-baseline/tests/"
          rustc --edition=2021 --test "$RUNNER_TEMP/spatial-baseline/tests/spatial_geometry.rs" -o "$RUNNER_TEMP/baseline-geometry"
          if "$RUNNER_TEMP/baseline-geometry" regression_front_and_back_are_centred --nocapture; then
            echo "Expected geometry regression was not reproduced"
            exit 1
          fi
      - name: Run corrected mixer and geometry tests
        run: |
          rustc --edition=2021 --test tests/spatial_geometry.rs -o "$RUNNER_TEMP/spatial-geometry"
          "$RUNNER_TEMP/spatial-geometry" --nocapture
