name: Build voice integration archive
on:
  push:
    branches: ["integration/wolfvoice-0.2.0"]
    paths: ["src/**", "Cargo.*", ".github/workflows/integration-build.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev
      - name: Build static test binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RUSTFLAGS: "-C link-arg=-lm -C link-arg=-lc"
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Package without installer
        run: |
          set -eu
          mkdir package
          cp target/x86_64-unknown-linux-musl/release/wolfvoice package/wolfvoice
          cp docs/INTEGRATION.md package/README.md
          git rev-parse HEAD > package/COMMIT.txt
          cd package
          sha256sum wolfvoice > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: wolfvoice-0.2.0-integration-linux-x86_64
          path: package/
          if-no-files-found: error
