name: Publish validated voice release
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/publish-validated.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.repository == 'Vlad-BloodMoon/wolfvoice' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify validated build provenance and download
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/39933496255 --jq .head_sha)" = 'd2d2670181b12354d51d83611ae5dbf36b822586'
          test "$(gh api repos/$GH_REPO/actions/runs/39933496255 --jq .conclusion)" = success
          gh run download 39933496255 --name 'wolfvoice-0.2.0-integration-linux-x86_64' --dir validated
          cd validated
          sha256sum -c SHA256SUMS
      - name: Package public files without grid credentials
        run: |
          set -euo pipefail
          mkdir dist
          cp validated/wolfvoice dist/wolfvoice-x86_64-linux-musl
          cp "docs/RELEASE-v0.2.0-bloodmoon.1.md" dist/README.md
          printf '%s\n' 'd2d2670181b12354d51d83611ae5dbf36b822586' > dist/BUILD_COMMIT.txt
          cd dist
          sha256sum wolfvoice-x86_64-linux-musl > wolfvoice-x86_64-linux-musl.sha256
          sha256sum -c wolfvoice-x86_64-linux-musl.sha256
          cd ..
      - name: Publish normal release
        run: |
          set -euo pipefail
          gh release create 'v0.2.0-bloodmoon.1' dist/* --target "$GITHUB_SHA" --title 'WolfVoice v0.2.0-bloodmoon.1 - private IM voice' --notes-file 'docs/RELEASE-v0.2.0-bloodmoon.1.md' --latest
