name: Publish validated voice release
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/publish-validated.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.repository == 'Vlad-BloodMoon/wolfvoice' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify validated build provenance and download
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/40700492483 --jq .head_sha)" = 'aa14b9c7bd37f67382b8d59945bda26d86e5975d'
          test "$(gh api repos/$GH_REPO/actions/runs/40700492483 --jq .conclusion)" = success
          gh run download 40700492483 --name 'wolfvoice-spatial-test-compatible-linux-x86_64' --dir validated
          test "$(cat validated/COMMIT.txt)" = 'aa14b9c7bd37f67382b8d59945bda26d86e5975d'
          cd validated
          sha256sum -c SHA256SUMS
      - name: Package public files without grid credentials
        run: |
          set -euo pipefail
          mkdir dist
          cp validated/wolfvoice dist/wolfvoice-x86_64-linux-musl
          cp docs/SPATIAL_INVESTIGATION.md dist/SPATIAL_FIX.md
          cp "docs/RELEASE-v0.2.0-bloodmoon.2.md" dist/README.md
          printf '%s\n' 'aa14b9c7bd37f67382b8d59945bda26d86e5975d' > dist/BUILD_COMMIT.txt
          cd dist
          sha256sum wolfvoice-x86_64-linux-musl > wolfvoice-x86_64-linux-musl.sha256
          sha256sum -c wolfvoice-x86_64-linux-musl.sha256
          cd ..
      - name: Publish normal release
        run: |
          set -euo pipefail
          gh release create 'v0.2.0-bloodmoon.2' dist/* --target "$GITHUB_SHA" --title 'WolfVoice v0.2.0-bloodmoon.2 - spatial voice correction' --notes-file 'docs/RELEASE-v0.2.0-bloodmoon.2.md' --latest
