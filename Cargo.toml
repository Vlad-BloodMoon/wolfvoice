[package]
name = "wolfvoice"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Spatial WebRTC voice service for OpenSimulator, speaking Linden Lab's voice protocol"
authors = ["Shadow Wolf", "Lone Wolf", "Wolf Territories Grid", "IntelligentWolf Ltd"]
license = "Apache-2.0"
repository = "https://github.com/intelligentwolf/wolfvoice"
readme = "README.md"
keywords = ["opensimulator", "webrtc", "voice", "opensim", "spatial-audio"]
categories = ["multimedia::audio", "network-programming"]

# By Shadow Wolf and Lone Wolf, Wolf Territories Grid and IntelligentWolf Ltd.
# Speaks Linden Lab's WebRTC voice contract so Firestorm (and any LL-compatible viewer)
# reaches it through the region's own capabilities, with spatialisation, per-user gain
# and mute performed here (server-side) because that is where LL's design puts them.
# See README.md and docs/PROTOCOL.md for the wire contract and its citations.

[dependencies]
# webrtc 0.20.x is a REWRITE over the sans-I/O `rtc` core; the pre-0.20 APIBuilder
# API does not exist here. 0.21 is a beta, so 0.20.3 is the latest stable.
webrtc = "0.20.3"
rtc = "0.20.3"

# libopus bindings. The crate compiles libopus from source via cmake, so cmake is a
# build requirement on every platform. We decode every speaker and re-encode a
# distinct mix per listener, so both halves are needed.
opus = "0.3"

tokio = { version = "1.35", features = ["full"] }
hyper = { version = "0.14", features = ["http1", "server", "runtime", "stream"] }
tokio-rustls = "0.24"
rustls = "0.21"
rustls-pemfile = "1.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
async-trait = "0.1"
futures = "0.3"
log = "0.4"
env_logger = "0.11"

# The optional story-voice feature (wolf.npc_speak, src/npc.rs, off unless
# WOLFVOICE_NPC_HOSTS is set) fetches a WAV clip over https. rustls with the bundled
# webpki roots, so the hardened unit needs no system trust store.
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# HMAC for room credentials (main.rs call_credentials). ring is already in the build
# through rustls, so this adds no new crate.
ring = "0.17"

# Only for examples/ - the end-to-end, compatibility and load harnesses. Not linked
# into the service.
[dev-dependencies]
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# No panic=abort: a panic in one voice session must not take down every other
# participant's audio.
